name: Bulkhead CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        check: [lint, type, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        if: matrix.check == 'test'
        with:
          node-version-file: .nvmrc
      - name: Install locked Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation --editable .
      - name: Lint
        if: matrix.check == 'lint'
        run: PATH="$PWD/.venv/bin:$PATH" make lint
      - name: Typecheck
        if: matrix.check == 'type'
        run: PATH="$PWD/.venv/bin:$PATH" make type
      - name: Offline tests
        if: matrix.check == 'test'
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/python -m pytest --cov=app.core --cov=app.api --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Upload coverage report
        if: matrix.check == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --offline
      - run: npm test

  accessibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --offline
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.lock --requirement requirements-browser.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation --editable .
      - run: .venv/bin/python -m playwright install chromium
      - run: .venv/bin/python -m pytest tests/test_frontend_static.py
      - run: PATH="$PWD/.venv/bin:$PATH" make accessibility

  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag bulkhead:ci .
      - name: Smoke-test healthcheck
        run: |
          docker run --detach --name bulkhead-ci --publish 8000:8000 bulkhead:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs bulkhead-ci
          exit 1
