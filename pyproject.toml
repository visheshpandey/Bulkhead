[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkhead"
version = "0.1.0"
description = "A zero-trust security gateway and immune system for AI agents."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bulkhead contributors" }]
requires-python = ">=3.11"
keywords = ["ai-agents", "security", "policy-gateway", "zero-trust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
]

[project.urls]
Homepage = "https://github.com/visheshpandey/Bulkhead"
Repository = "https://github.com/visheshpandey/Bulkhead"
Issues = "https://github.com/visheshpandey/Bulkhead/issues"
Documentation = "https://github.com/visheshpandey/Bulkhead/tree/master/docs"

[project.scripts]
bulkhead-mcp = "app.agents.mcp_server:main"
bulkhead-server = "app.main:serve"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[project.optional-dependencies]
dev = [
    "coverage==7.8.2",
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pre-commit==4.3.0",
    "pytest==8.4.2",
    "pytest-cov==6.2.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C901", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/check_frontend.py" = ["E402"]
"scripts/capture_demo_gif.py" = ["E402"]
"tests/*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
